name: Build, Test and Release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure science core
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DATLAS_BUILD_GUI=OFF
      - name: Compile C++20 (CSPICE disabled baseline)
        run: cmake --build build --parallel
      - name: Run geometry/solar tests
        run: ctest --test-dir build --output-on-failure

  gui-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
      - name: Download NASA NAIF Windows x64 CSPICE N0067 and unmodified JPL kernels
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "nasa-naif-cspice.zip"
          & curl.exe -fL --retry 3 --connect-timeout 30 "https://naif.jpl.nasa.gov/pub/naif/toolkit/C/PC_Windows_VisualC_64bit/packages/cspice.zip" -o "$zip"
          if ($LASTEXITCODE -ne 0) { throw "NASA NAIF official Windows CSPICE download failed" }
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP" -Force
          $root=Join-Path $env:RUNNER_TEMP "cspice"
          if (!(Test-Path (Join-Path $root "include/SpiceUsr.h"))) { throw "CSPICE header missing" }
          if (!(Test-Path (Join-Path $root "lib/cspice.lib"))) { throw "Official Windows cspice.lib missing" }
          python scripts/fetch_spice_kernels.py --output (Join-Path $env:RUNNER_TEMP "kernels")
          if ($LASTEXITCODE -ne 0) { throw "NASA/JPL kernel download failed" }
          foreach ($name in @("de442s.bsp","naif0012.tls","moon_pa_de440_200625.bpc","moon_de440_250416.tf")) {
            if (!(Test-Path (Join-Path $env:RUNNER_TEMP "kernels/$name"))) { throw "Missing JPL kernel $name" }
          }
      - name: Configure Qt6 and official Windows CSPICE
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DATLAS_ENABLE_CSPICE=ON "-DCSPICE_ROOT=$env:RUNNER_TEMP/cspice" "-DATLAS_SPICE_LSK=$env:RUNNER_TEMP/kernels/naif0012.tls" "-DATLAS_SPICE_SPK=$env:RUNNER_TEMP/kernels/de442s.bsp"
          if ($LASTEXITCODE -ne 0) { throw "Windows CSPICE CMake configure failed" }
      - name: Compile native Qt GUI
        shell: pwsh
        run: cmake --build build --config Release --parallel
      - name: Run JPL ephemerides, eclipse and lunar-frame tests on Windows
        shell: pwsh
        run: |
          $env:ATLAS_SPICE_MOON_FK=Join-Path $env:RUNNER_TEMP "kernels/moon_de440_250416.tf"
          $env:ATLAS_SPICE_MOON_PCK=Join-Path $env:RUNNER_TEMP "kernels/moon_pa_de440_200625.bpc"
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "NASA JPL Windows SPICE tests failed" }
      - name: Deploy portable Windows build with official Qt tool
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Join-Path $PWD "dist/CelestialAtlas"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $binary = Join-Path $PWD "build/Release/CelestialAtlas.exe"
          if (!(Test-Path $binary)) { throw "Qt GUI was not produced" }
          Copy-Item $binary (Join-Path $dist "CelestialAtlas.exe")
          & windeployqt --release --no-compiler-runtime (Join-Path $dist "CelestialAtlas.exe")
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }
          if (!(Test-Path (Join-Path $dist "platforms/qwindows.dll"))) { throw "Qt Windows platform plugin missing" }
          Copy-Item "docs/WINDOWS-PORTABLE.md" (Join-Path $dist "README-WINDOWS.md")
          Copy-Item "LICENSE" (Join-Path $dist "LICENSE.txt")
          Copy-Item "docs/NAIF-ATTRIBUTION.md" (Join-Path $dist "NASA-NAIF-ATTRIBUTION.md")
          $dataFolder=Join-Path $dist "kernels"
          New-Item -ItemType Directory -Force -Path $dataFolder | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP "kernels/*") $dataFolder -Force
          foreach ($name in @("de442s.bsp","naif0012.tls","moon_pa_de440_200625.bpc","moon_de440_250416.tf")) {
            if (!(Test-Path (Join-Path $dataFolder $name))) { throw "Portable kernel missing: $name" }
          }
          & (Join-Path $dist "CelestialAtlas.exe") --spice-self-test
          if ($LASTEXITCODE -ne 0) { throw "Packaged Windows executable failed real NASA SPICE self-test" }
          Compress-Archive -Path $dist -DestinationPath (Join-Path $PWD "CelestialAtlas-v0.7.0-Windows-x64.zip") -Force
          Get-FileHash "CelestialAtlas-v0.7.0-Windows-x64.zip" -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable-x64
          path: CelestialAtlas-v0.7.0-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  render-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native Qt6 and Mesa software OpenGL
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev libqt6opengl6-dev xvfb xauth \
            libgl1-mesa-dri libglx-mesa0 libxcb-cursor0 python3-pil fonts-noto-cjk
      - name: Download official NASA NAIF N0067 toolkit and JPL DE442s
        shell: bash
        run: |
          curl --fail --location --retry 3 --connect-timeout 30 \
            "https://naif.jpl.nasa.gov/pub/naif/toolkit/C/PC_Linux_GCC_64bit/packages/cspice.tar.Z" \
            --output "$RUNNER_TEMP/cspice.tar.Z"
          tar -xf "$RUNNER_TEMP/cspice.tar.Z" -C "$RUNNER_TEMP"
          test -f "$RUNNER_TEMP/cspice/include/SpiceUsr.h"
          test -f "$RUNNER_TEMP/cspice/lib/cspice.a"
          /usr/bin/python3 scripts/fetch_spice_kernels.py --output "$RUNNER_TEMP/kernels"
          test -s "$RUNNER_TEMP/kernels/naif0012.tls"
          test -s "$RUNNER_TEMP/kernels/de442s.bsp"
          test -s "$RUNNER_TEMP/kernels/moon_pa_de440_200625.bpc"
          test -s "$RUNNER_TEMP/kernels/moon_de440_250416.tf"
      - name: Compile Linux GUI with official CSPICE
        shell: bash
        run: |
          cmake -S . -B build-gui -DCMAKE_BUILD_TYPE=Release \
            -DATLAS_BUILD_GUI=ON -DATLAS_ENABLE_CSPICE=ON \
            -DCSPICE_ROOT="$RUNNER_TEMP/cspice" \
            -DATLAS_SPICE_LSK="$RUNNER_TEMP/kernels/naif0012.tls" \
            -DATLAS_SPICE_SPK="$RUNNER_TEMP/kernels/de442s.bsp"
          cmake --build build-gui --parallel 2
          test -x build-gui/CelestialAtlas
          export ATLAS_SPICE_MOON_FK="$RUNNER_TEMP/kernels/moon_de440_250416.tf"
          export ATLAS_SPICE_MOON_PCK="$RUNNER_TEMP/kernels/moon_pa_de440_200625.bpc"
          ctest --test-dir build-gui --output-on-failure
      - name: Fetch verified NASA Blue Marble satellite mosaic
        shell: bash
        run: |
          /usr/bin/python3 scripts/fetch_nasa_earth.py --output "$RUNNER_TEMP/bluemarble-2048.png"
      - name: Fetch authentic NASA LRO global Moon mosaic
        shell: bash
        run: |
          /usr/bin/python3 scripts/fetch_nasa_moon.py --output "$RUNNER_TEMP/lroc_color_2k.jpg"
          test -s "$RUNNER_TEMP/lroc_color_2k.jpg"
      - name: Run real C++ OpenGL renderer under Xvfb/Mesa
        shell: bash
        run: |
          env ATLAS_SPICE_KERNEL_DIR="$RUNNER_TEMP/kernels" \
            LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=3.3 QT_QPA_PLATFORM=xcb \
            xvfb-run -a -s "-screen 0 1280x900x24" \
            ./build-gui/CelestialAtlas \
              --texture "$RUNNER_TEMP/bluemarble-2048.png" \
              --screenshot "$PWD/CelestialAtlas-real-viewport.png" \
              --workbench-screenshot "$PWD/CelestialAtlas-real-workbench.png"
          test -s CelestialAtlas-real-viewport.png
          test -s CelestialAtlas-real-viewport.png.provenance.json
          test -s CelestialAtlas-real-workbench.png
          test -s CelestialAtlas-real-workbench.png.provenance.json
          env ATLAS_SPICE_KERNEL_DIR="$RUNNER_TEMP/kernels" \
            LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=3.3 QT_QPA_PLATFORM=xcb \
            xvfb-run -a -s "-screen 0 1280x900x24" \
            ./build-gui/CelestialAtlas \
              --scene moon --moon-texture "$RUNNER_TEMP/lroc_color_2k.jpg" \
              --utc 2024-03-25T07:00:00Z \
              --screenshot "$PWD/CelestialAtlas-moon-full-20240325.png" \
              --workbench-screenshot "$PWD/CelestialAtlas-real-moon-workbench.png"
          env ATLAS_SPICE_KERNEL_DIR="$RUNNER_TEMP/kernels" \
            LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=3.3 QT_QPA_PLATFORM=xcb \
            xvfb-run -a -s "-screen 0 1280x900x24" \
            ./build-gui/CelestialAtlas \
              --scene moon --moon-texture "$RUNNER_TEMP/lroc_color_2k.jpg" \
              --utc 2024-04-08T18:00:00Z \
              --screenshot "$PWD/CelestialAtlas-moon-new-20240408.png"
          test -s CelestialAtlas-real-moon-workbench.png
          test -s CelestialAtlas-real-moon-workbench.png.provenance.json
          test -s CelestialAtlas-moon-full-20240325.png
          test -s CelestialAtlas-moon-new-20240408.png
          test -s CelestialAtlas-moon-full-20240325.png.provenance.json
          test -s CelestialAtlas-moon-new-20240408.png.provenance.json
          for spec in "2024-03-25T07:00:00Z em-20240325" "2024-04-08T18:00:00Z em-20240408"; do
            set -- $spec
            env ATLAS_SPICE_KERNEL_DIR="$RUNNER_TEMP/kernels" \
              LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=3.3 QT_QPA_PLATFORM=xcb \
              xvfb-run -a -s "-screen 0 1280x900x24" \
              ./build-gui/CelestialAtlas \
                --scene system --texture "$RUNNER_TEMP/bluemarble-2048.png" \
                --moon-texture "$RUNNER_TEMP/lroc_color_2k.jpg" --utc "$1" \
                --screenshot "$PWD/CelestialAtlas-$2.png" \
                --workbench-screenshot "$PWD/CelestialAtlas-$2-workbench.png"
          done
          env ATLAS_SPICE_KERNEL_DIR="$RUNNER_TEMP/kernels" \
            LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=3.3 QT_QPA_PLATFORM=xcb \
            xvfb-run -a -s "-screen 0 1280x900x24" \
            ./build-gui/CelestialAtlas --scene system --system-scale true \
              --texture "$RUNNER_TEMP/bluemarble-2048.png" \
              --moon-texture "$RUNNER_TEMP/lroc_color_2k.jpg" \
              --utc 2024-03-25T07:00:00Z \
              --screenshot "$PWD/CelestialAtlas-em-true-scale.png"
          test -s CelestialAtlas-em-true-scale.png
          test -s CelestialAtlas-em-20240325.png
          test -s CelestialAtlas-em-20240408.png
          /usr/bin/python3 - <<'PY'
          import json
          moon=json.load(open("CelestialAtlas-real-moon-workbench.png.provenance.json",encoding="utf-8"))
          assert moon["rendered_body"]=="Moon" and "4720" in moon["actual_render_texture"],moon
          assert "DE440" in moon["moon_orientation"], moon
          for shot in ("CelestialAtlas-moon-full-20240325.png","CelestialAtlas-moon-new-20240408.png"):
              observed=json.load(open(shot+".provenance.json",encoding="utf-8"))
              assert observed["rendered_body"]=="Moon" and "DE440" in observed["moon_orientation"],observed
          for file in ("CelestialAtlas-real-workbench.png.provenance.json",
                       "CelestialAtlas-real-viewport.png.provenance.json"):
              record=json.load(open(file, encoding="utf-8"))
              assert record["lunar_ephemeris"].startswith("JPL DE442s"), record
          import math
          p1=json.load(open("CelestialAtlas-em-20240325.png.provenance.json"))
          p2=json.load(open("CelestialAtlas-em-20240408.png.provenance.json"))
          pt=json.load(open("CelestialAtlas-em-true-scale.png.provenance.json"))
          for p in (p1,p2,pt):
              assert p["rendered_body"]=="EarthMoon" and "DE440" in p["moon_orientation"], p
              distance=math.sqrt(sum(float(v)**2 for v in p["moon_center_j2000_km"]))
              assert 340000<distance<410000, p
              assert abs(distance-p["earth_moon_distance_km"])<0.001, p
          assert p1["earth_moon_center_compression"]==12, p1
          assert pt["earth_moon_center_compression"]==1, pt
          displacement=math.dist(p1["moon_center_j2000_km"],p2["moon_center_j2000_km"])
          assert displacement>200000, f"JPL lunar center did not move sufficiently: {displacement}"
          with open("earth-moon-geometry-metrics.json","w") as f:
              json.dump({"source":"NASA NAIF / JPL DE442s geometric J2000",
                         "moon_orientation":"DE440 Moon ME PCK/FK",
                         "dates_utc":["2024-03-25T07:00:00Z","2024-04-08T18:00:00Z"],
                         "earth_moon_distance_km":[p1["earth_moon_distance_km"],p2["earth_moon_distance_km"]],
                         "moon_center_displacement_km":displacement,
                         "compressed_center_distance_factor":12,
                         "real_center_distance_factor":1,
                         "radii_km":{"Earth":6371.0,"Moon":1737.4}},f,indent=2)
          print(f"Real Earth-Moon J2000 position drift: {displacement:.1f} km")
          print("Actual rendered screenshots contain verified CSPICE data provenance")
          PY
      - name: Validate resulting bitmap is nonblank and contains a textured Earth
        shell: bash
        run: |
          /usr/bin/python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          for filename in ("CelestialAtlas-real-viewport.png","CelestialAtlas-real-workbench.png"):
              p=Path(filename)
              im=Image.open(p).convert("RGB")
              width,height=im.size
              assert width >= 300 and height >= 300, f"Unexpected dimensions: {filename} {width}x{height}"
              px=list(im.resize((220,220)).getdata())
              bright=sum(max(r,g,b)>55 for r,g,b in px)
              blue=sum(b>r*1.12 and b>g*1.03 and b>65 for r,g,b in px)
              assert bright > 650, f"No rendered image in {filename}: bright={bright}"
              assert blue > 150, f"Observed blue Earth not visible in {filename}: blue={blue}"
              print(f"Actual C++/Qt rendering {filename} {width}x{height}, {p.stat().st_size} bytes; visible={bright}, blue={blue}")
          moon=Path("CelestialAtlas-real-moon-workbench.png")
          lunar=Image.open(moon).convert("RGB")
          assert lunar.size[0]>=1000 and lunar.size[1]>=500,"Moon desktop screenshot dimensions"
          sampled=list(lunar.resize((160,160)).getdata())
          neutral=sum(55<max(rgb)<235 and max(rgb)-min(rgb)<45 for rgb in sampled)
          assert neutral>220, f"Missing gray lunar observed features: neutral={neutral}"
          print(f"Authentic Moon desktop preview: {moon.stat().st_size} bytes, gray features {neutral}")
          def lunar_luminance(path):
              frame=Image.open(path).convert("RGB")
              w,h=frame.size
              middle=frame.crop((int(.22*w),int(.20*h),int(.78*w),int(.80*h)))
              return sum((r+g+b)/3 for r,g,b in middle.getdata())/(middle.width*middle.height)
          full=lunar_luminance("CelestialAtlas-moon-full-20240325.png")
          new=lunar_luminance("CelestialAtlas-moon-new-20240408.png")
          assert full>new+12, f"Actual Moon rendering did not follow JPL phase: full={full}, new={new}"
          print(f"Actual lunar phase render brightness — full={full:.2f}, new={new:.2f}; delta={full-new:.2f}")
          for name in ("CelestialAtlas-em-20240325.png","CelestialAtlas-em-20240408.png","CelestialAtlas-em-true-scale.png"):
              image=Image.open(name).convert("RGB")
              assert image.width>=300 and image.height>=300
              px=list(image.resize((180,180)).getdata())
              blue=sum(b>r*1.12 and b>g*1.03 and b>65 for r,g,b in px)
              if "true-scale" not in name:
                  assert blue>18,f"No Blue Marble in shared render: {name} blue={blue}"
              print(f"Actual shared Earth-Moon render: {name}; blue pixels {blue}")
          import json
          payload={"version":"0.7.0",
                   "data":"Real NASA LRO globe, JPL DE440 Moon orientation, DE442s Sun/Moon position",
                   "epoch_full":"2024-03-25T07:00:00Z",
                   "epoch_new":"2024-04-08T18:00:00Z",
                   "method":"Central 56% x 60% of original Qt OpenGL viewport, mean RGB / 3, scale 0-255",
                   "mean_full_rgb":round(full,4),
                   "mean_new_rgb":round(new,4),
                   "full_minus_new":round(full-new,4),
                   "threshold":12,
                   "kind":"Visual regression test, not calibrated photometry"}
          Path("lunar-render-metrics.json").write_text(json.dumps(payload,indent=2)+"\n",encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: verified-earth-render
          path: |
            CelestialAtlas-real-viewport.png
            CelestialAtlas-real-viewport.png.provenance.json
            CelestialAtlas-real-workbench.png
            CelestialAtlas-real-workbench.png.provenance.json
            CelestialAtlas-real-moon-workbench.png
            CelestialAtlas-real-moon-workbench.png.provenance.json
            CelestialAtlas-moon-full-20240325.png
            CelestialAtlas-moon-new-20240408.png
            CelestialAtlas-moon-full-20240325.png.provenance.json
            CelestialAtlas-moon-new-20240408.png.provenance.json
            lunar-render-metrics.json
            earth-moon-geometry-metrics.json
            CelestialAtlas-em-*.png
            CelestialAtlas-em-*.png.provenance.json
          if-no-files-found: error
          retention-days: 30

  release-v0_7_0:
    needs: [core-linux, gui-windows, render-linux]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: windows-portable-x64
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: verified-earth-render
          path: .
      - name: Publish immutable v0.7.0 source, portable and real screenshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v0.7.0 >/dev/null 2>&1; then
            echo "Version v0.7.0 already published. Refusing to overwrite an immutable release."
            exit 0
          fi
          test -s CelestialAtlas-v0.7.0-Windows-x64.zip
          git archive --format=zip --output=CelestialAtlas-v0.7.0-source.zip HEAD
          test -s CelestialAtlas-real-viewport.png
          test -s CelestialAtlas-real-workbench.png
          test -s CelestialAtlas-real-moon-workbench.png
          test -s CelestialAtlas-moon-full-20240325.png
          test -s CelestialAtlas-moon-new-20240408.png
          test -s lunar-render-metrics.json
          test -s earth-moon-geometry-metrics.json
          sha256sum CelestialAtlas-v0.7.0-*.zip CelestialAtlas-real-*.png CelestialAtlas-moon-*.png CelestialAtlas-em-*.png > SHA256SUMS.txt
          gh release create v0.7.0 \
            CelestialAtlas-v0.7.0-source.zip \
            CelestialAtlas-v0.7.0-Windows-x64.zip \
            SHA256SUMS.txt \
            CelestialAtlas-real-viewport.png \
            CelestialAtlas-real-viewport.png.provenance.json \
            CelestialAtlas-real-workbench.png \
            CelestialAtlas-real-workbench.png.provenance.json \
            CelestialAtlas-real-moon-workbench.png \
            CelestialAtlas-real-moon-workbench.png.provenance.json \
            CelestialAtlas-moon-full-20240325.png \
            CelestialAtlas-moon-full-20240325.png.provenance.json \
            CelestialAtlas-moon-new-20240408.png \
            CelestialAtlas-moon-new-20240408.png.provenance.json \
            lunar-render-metrics.json \
            earth-moon-geometry-metrics.json \
            CelestialAtlas-em-20240325.png \
            CelestialAtlas-em-20240325.png.provenance.json \
            CelestialAtlas-em-20240325-workbench.png \
            CelestialAtlas-em-20240325-workbench.png.provenance.json \
            CelestialAtlas-em-20240408.png \
            CelestialAtlas-em-20240408.png.provenance.json \
            CelestialAtlas-em-20240408-workbench.png \
            CelestialAtlas-em-20240408-workbench.png.provenance.json \
            CelestialAtlas-em-true-scale.png \
            CelestialAtlas-em-true-scale.png.provenance.json \
            --target "${GITHUB_SHA}" \
            --title 'Celestial Atlas v0.7.0 — Windows NAIF CSPICE + JPL Earth-Moon Shared 3D Space' \
            --prerelease \
            --notes 'C++20/Qt6/OpenGL native astronomy preview. Linux CI downloads official NASA NAIF CSPICE/JPL ephemerides and real LROC LRO lunar and Blue Marble Earth mosaics. Both scenes render actual OpenGL screenshots with source provenance; numerical Moon-phase and eclipse-epoch tests still use official kernels. Linux CSPICE-enabled builds render a shared J2000 Earth-Moon scene using actual JPL Moon center coordinates, DE440 orientation and real NASA imagery; two epochs and both true/compressed distance scales are verified, alongside full/new Moon screenshots. Windows fallback remains a fixed survey lamp without SPICE. Windows portable build is compiled WITHOUT CSPICE and correctly labels precision Moon values unavailable. Earth sunlight/rotation remains approximate; precise Earth orientation is not yet implemented. No fake planetary images. See SPICE-INTEGRATION.md and README-WINDOWS.md.'
