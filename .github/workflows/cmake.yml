name: Build, Test and Release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure science core
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DATLAS_BUILD_GUI=OFF
      - name: Compile C++20
        run: cmake --build build --parallel
      - name: Run geometry/solar tests
        run: ctest --test-dir build --output-on-failure

  gui-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
      - name: Configure Qt6 / Visual Studio
        shell: pwsh
        run: cmake -S . -B build -G 'Visual Studio 17 2022' -A x64
      - name: Compile native Qt GUI
        shell: pwsh
        run: cmake --build build --config Release --parallel
      - name: Run scientific core tests
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Deploy portable Windows build with official Qt tool
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Join-Path $PWD "dist/CelestialAtlas"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $binary = Join-Path $PWD "build/Release/CelestialAtlas.exe"
          if (!(Test-Path $binary)) { throw "Qt GUI was not produced" }
          Copy-Item $binary (Join-Path $dist "CelestialAtlas.exe")
          & windeployqt --release --no-compiler-runtime (Join-Path $dist "CelestialAtlas.exe")
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }
          if (!(Test-Path (Join-Path $dist "platforms/qwindows.dll"))) { throw "Qt Windows platform plugin missing" }
          Copy-Item "docs/WINDOWS-PORTABLE.md" (Join-Path $dist "README-WINDOWS.md")
          Copy-Item "LICENSE" (Join-Path $dist "LICENSE.txt")
          Compress-Archive -Path $dist -DestinationPath (Join-Path $PWD "CelestialAtlas-v0.2.2-Windows-x64.zip") -Force
          Get-FileHash "CelestialAtlas-v0.2.2-Windows-x64.zip" -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable-x64
          path: CelestialAtlas-v0.2.2-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  render-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native Qt6 and Mesa software OpenGL
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev libqt6opengl6-dev xvfb xauth \
            libgl1-mesa-dri libglx-mesa0 libxcb-cursor0 python3-pil fonts-noto-cjk
      - name: Compile Linux GUI (not only numerical core)
        shell: bash
        run: |
          cmake -S . -B build-gui -DCMAKE_BUILD_TYPE=Release -DATLAS_BUILD_GUI=ON
          cmake --build build-gui --parallel 2
          test -x build-gui/CelestialAtlas
      - name: Fetch verified NASA Blue Marble satellite mosaic
        shell: bash
        run: |
          /usr/bin/python3 scripts/fetch_nasa_earth.py --output "$RUNNER_TEMP/bluemarble-2048.png"
      - name: Run real C++ OpenGL renderer under Xvfb/Mesa
        shell: bash
        run: |
          env LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=3.3 QT_QPA_PLATFORM=xcb \
            xvfb-run -a -s "-screen 0 1280x900x24" \
            ./build-gui/CelestialAtlas \
              --texture "$RUNNER_TEMP/bluemarble-2048.png" \
              --screenshot "$PWD/CelestialAtlas-real-viewport.png" \
              --workbench-screenshot "$PWD/CelestialAtlas-real-workbench.png"
          test -s CelestialAtlas-real-viewport.png
          test -s CelestialAtlas-real-viewport.png.provenance.json
          test -s CelestialAtlas-real-workbench.png
          test -s CelestialAtlas-real-workbench.png.provenance.json
      - name: Validate resulting bitmap is nonblank and contains a textured Earth
        shell: bash
        run: |
          /usr/bin/python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          for filename in ("CelestialAtlas-real-viewport.png","CelestialAtlas-real-workbench.png"):
              p=Path(filename)
              im=Image.open(p).convert("RGB")
              width,height=im.size
              assert width >= 300 and height >= 300, f"Unexpected dimensions: {filename} {width}x{height}"
              px=list(im.resize((220,220)).getdata())
              bright=sum(max(r,g,b)>55 for r,g,b in px)
              blue=sum(b>r*1.12 and b>g*1.03 and b>65 for r,g,b in px)
              assert bright > 650, f"No rendered image in {filename}: bright={bright}"
              assert blue > 150, f"Observed blue Earth not visible in {filename}: blue={blue}"
              print(f"Actual C++/Qt rendering {filename} {width}x{height}, {p.stat().st_size} bytes; visible={bright}, blue={blue}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: verified-earth-render
          path: |
            CelestialAtlas-real-viewport.png
            CelestialAtlas-real-viewport.png.provenance.json
            CelestialAtlas-real-workbench.png
            CelestialAtlas-real-workbench.png.provenance.json
          if-no-files-found: error
          retention-days: 30

  release-v0_2_2:
    needs: [core-linux, gui-windows, render-linux]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: windows-portable-x64
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: verified-earth-render
          path: .
      - name: Publish immutable v0.2.2 source, portable and real screenshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v0.2.2 >/dev/null 2>&1; then
            echo "Version v0.2.2 already published. Refusing to overwrite an immutable release."
            exit 0
          fi
          test -s CelestialAtlas-v0.2.2-Windows-x64.zip
          git archive --format=zip --output=CelestialAtlas-v0.2.2-source.zip HEAD
          test -s CelestialAtlas-real-viewport.png
          test -s CelestialAtlas-real-workbench.png
          sha256sum CelestialAtlas-v0.2.2-*.zip CelestialAtlas-real-*.png > SHA256SUMS.txt
          gh release create v0.2.2 \
            CelestialAtlas-v0.2.2-source.zip \
            CelestialAtlas-v0.2.2-Windows-x64.zip \
            SHA256SUMS.txt \
            CelestialAtlas-real-viewport.png \
            CelestialAtlas-real-viewport.png.provenance.json \
            CelestialAtlas-real-workbench.png \
            CelestialAtlas-real-workbench.png.provenance.json \
            --target "${GITHUB_SHA}" \
            --title 'Celestial Atlas v0.2.2 — Windows Portable + Verified Earth & Workspace Renders' \
            --prerelease \
            --notes 'Native C++20/Qt6/OpenGL 3.3 portable preview. Linux Mesa CI ran the actual Earth renderer with NASA imagery and validated its PNG export. Windows portable package built and tested on GitHub Actions. Requires a compatible GPU and Microsoft Visual C++ Redistributable (x64). Earth imagery is downloaded separately from NASA. Solar geometry remains approximate; CSPICE is not integrated. A successful CI compile does not guarantee GPU rendering on every PC. See README-WINDOWS.md for use and limitations.'
